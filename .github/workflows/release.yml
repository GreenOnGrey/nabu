# Релиз репозитория nabu (FTR.NAB.CMN-0001 arch §11, по образцу FTR.HMR.INFRA-0002):
# по тегу vX.Y.Z публикуются чарты nabu-core и nabu-web с версией X.Y.Z в
# oci://ghcr.io/<организация>/charts, затем скрипт выкатки bin/nabu-deploy
# раскладывается на машину стенда (/opt/nabu/releases/<тег>, current → тег).
# Переиспользуемый deploy-component.yml этого тега вызывают релизы nabu-core
# и nabu-web; он запускает /opt/nabu/current/bin/nabu-deploy.
# Порядок изменений: тег nabu → DEPLOY_WORKFLOW_REF и CHART_VERSION в
# nabu-core и nabu-web (deploy/versions.env) → теги core и web.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Тег (vX.Y.Z)", required: true, type: string }
concurrency: { group: nabu-release, cancel-in-progress: false }
permissions: { contents: read }

env:
  DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT || 'ssh' }}
  NABU_DIR: /opt/nabu

jobs:
  publish-charts:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Тег
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ $INPUT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::тег «$INPUT_TAG» не в формате vX.Y.Z"; exit 1; }
          echo "tag=$INPUT_TAG" >>"$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/tags/${{ steps.tag.outputs.tag }}" }
      - name: Helm
        run: |
          set -a; source config/versions.env; set +a
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" -o /tmp/helm.tgz
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: lint, package, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          repo="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          echo "## Чарты $VERSION" >>"$GITHUB_STEP_SUMMARY"
          for chart in nabu-core nabu-web; do
            # Повторный запуск того же тега: версия уже в реестре — не перезаписываем.
            if helm show chart "$repo/$chart" --version "$VERSION" >/dev/null 2>&1; then
              echo "- $repo/$chart:$VERSION — уже опубликован" >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            helm lint "charts/$chart" --set image.tag=v0.0.0 --set publicBaseDomain=example.org
            helm package "charts/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
            helm push "dist/$chart-$VERSION.tgz" "$repo"
            echo "- $repo/$chart:$VERSION" >>"$GITHUB_STEP_SUMMARY"
          done

  install:
    needs: publish-charts
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read, id-token: write }
    timeout-minutes: 15
    env:
      TAG: ${{ needs.publish-charts.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/tags/${{ needs.publish-charts.outputs.tag }}" }
      - name: Доступ к машине (ssh)
        if: env.DEPLOY_TRANSPORT == 'ssh'
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: bash .github/scripts/ssh-setup.sh
      - name: Доступ к машине (gcp-iap)
        if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Скрипт выкатки на машину стенда
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        # Машине не нужен доступ к GitHub: выгрузка тега идёт по тому же SSH.
        run: |
          remote() { bash .github/scripts/remote.sh "$@"; }
          git archive --format=tar.gz HEAD bin charts | remote "set -e
            d=$NABU_DIR
            [ -w \"\$d\" ] || [ -w \"\$(dirname \"\$d\")\" ] || sudo -n install -d -o \"\$(id -un)\" \"\$d\"
            mkdir -p \"\$d/releases/$TAG.tmp\" \"\$d/logs\"
            tar -xzf - -C \"\$d/releases/$TAG.tmp\"
            rm -rf \"\$d/releases/$TAG\" && mv \"\$d/releases/$TAG.tmp\" \"\$d/releases/$TAG\"
            ln -sfn \"releases/$TAG\" \"\$d/current\"
            ls -1dt \"\$d\"/releases/v* | tail -n +6 | xargs -r rm -rf
            echo \"nabu $TAG: \$d/current\""
          echo "Скрипт выкатки $TAG установлен в $NABU_DIR/current" >>"$GITHUB_STEP_SUMMARY"
