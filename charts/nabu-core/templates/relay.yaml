{{ include "nabu.deployment" (dict "root" . "name" "relay" "ports" (list (dict "name" "relay" "port" 8085)) "grace" 30) }}
---
# Каналы рабочих пространств (WebSocket) и вызовы инструментов оператора агента.
apiVersion: v1
kind: Service
metadata:
  name: relay
  labels:
    {{- include "nabu.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  type: ClusterIP
  selector: {{- include "nabu.selector" (dict "root" . "component" "relay") | nindent 4 }}
  ports:
    - { name: relay, port: 8085, targetPort: relay }
